services:
  - type: web
    name: wound-healing-ai
    runtime: docker
    plan: free            # 512 Mo de RAM : suffisant pour l'interface + 1 modèle (pas l'ensemble de 4)
    healthCheckPath: /_stcore/health
    envVars:
      - key: MODEL_URLS   # URL du .pt dans la GitHub Release
        value: https://github.com/sarrachtioui2001/wound-healing-ai/releases/download/v1/unet_resnet34_best.pt
